<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/admin.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/add_user.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      <!-- ================= NAVBAR ================= -->
      <nav>
        <ul>
          <li>
            <a href="/admin" class="logo">
              <img
                src="{{ url_for('static', filename='Files/Resources/admin_icon.jpg') }}"
                alt="Admin Icon"
              />
              <span class="nav-item">Admin</span>
            </a>
          </li>

          <li>
            <a href="/admin">
              <i class="fas fa-menorah"></i>
              <span class="nav-item">Dashboard</span>
            </a>
          </li>

          <li>
            <a href="javascript:location.reload();">
              <i class="fas fa-database"></i>
              <span class="nav-item">Add Record</span>
            </a>
          </li>

          <li>
            <a href="/admin_attendance_list">
              <i class="fas fa-chart-bar"></i>
              <span class="nav-item">Attendance Records</span>
            </a>
          </li>

          <li>
            <a href="/admin_login" class="logout">
              <i class="fas fa-sign-out-alt"></i>
              <span class="nav-item">Log out</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- ================= FORM ================= -->
      <section class="container1">
        <header>Add Student</header>

        <form
          action="/admin/add_user"
          method="post"
          enctype="multipart/form-data"
          class="form"
        >
          <div class="input-box">
            <label>ID</label>
            <input type="text" name="id" placeholder="Student Unique ID" required />
          </div>

          <div class="input-box">
            <label>Full Name</label>
            <input type="text" name="name" placeholder="Full Name" required />
          </div>

          <div class="input-box">
            <label>Password</label>
            <input type="password" name="password" placeholder="Password" required />
          </div>

          <div class="input-box">
            <label>Email</label>
            <input type="email" name="email" placeholder="Email Address" required />
          </div>

          <div class="column">
            <div class="input-box">
              <label>Phone</label>
              <input type="text" name="phone" placeholder="Phone Number" required />
            </div>

            <div class="input-box">
              <label>Date of Birth</label>
              <input type="date" name="dob" required />
            </div>
          </div>

          <div class="input-box address">
            <label>Address</label>
            <div class="column">
              <input type="text" name="city" placeholder="City" required />
              <div class="select-box">
                <select name="country" required>
                  <option value="" hidden>Select Country</option>
                  <option>India</option>
                  <option>USA</option>
                  <option>Canada</option>
                  <option>UK</option>
                  <option>Japan</option>
                  <option>Nepal</option>
                </select>
              </div>
            </div>
          </div>

          <div class="input-box">
            <label>Major</label>
            <input type="text" name="major" placeholder="Major" required />
          </div>

          <div class="input-box">
            <label>Starting Year</label>
            <input type="number" name="starting_year" required />
          </div>

          <div class="input-box">
            <label>Current Year</label>
            <input type="number" name="year" required />
          </div>

          <div class="input-box">
            <label>Standing</label>
            <input type="text" name="standing" placeholder="Grade / Standing" required />
          </div>

          <div class="input-box">
            <label>Total Attendance</label>
            <input type="number" name="total_attendance" required />
          </div>

          <div class="column">
            <div class="input-box">
              <label>Last Attendance Date</label>
              <input type="date" name="last_attendance_date" required />
            </div>

            <div class="input-box">
              <label>Last Attendance Time</label>
              <input type="time" name="last_attendance_time" required />
            </div>
          </div>

          <div class="input-box">
            <label>Notes</label>
            <textarea
              name="content"
              rows="3"
              placeholder="Additional Notes"
              required
            ></textarea>
          </div>

          <div class="input-box">
            <label>Upload Image</label>
            <input
              type="file"
              name="image"
              accept=".jpg,.jpeg,.png"
              required
            />
          </div>

          <button type="submit">Submit</button>
        </form>
      </section>
    </div>
  </body>
</html>
